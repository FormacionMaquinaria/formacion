<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Daniel González">
<meta name="copyright" content="© 2026 Daniel González. Todos los derechos reservados.">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talleres de casos</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../engranaje.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#E8EAED;--card:#fff;--ink:#1F2124;--mute:#5B6068;--line:#CDD1D6;--yel:#FFB800;--soft:#FFF4D1;--ok:#2E7D4F;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#16171A;--card:#202226;--ink:#ECEDEF;--mute:#A3A8B0;--line:#363A40;--soft:#3A3000;--ok:#6CC08F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:20px 12px}
h1{font-family:var(--cond);font-size:1.6rem;line-height:1.15;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
.mute{color:var(--mute)}
.go,.btn{display:block;width:100%;font:inherit;font-weight:600;padding:12px;border:none;border-radius:10px;background:var(--yel);color:#1F2124;text-align:center;text-decoration:none;cursor:pointer;margin-top:10px}
.btn[disabled]{opacity:.6;cursor:default}
.pg{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.pg i{display:block;height:100%;background:var(--yel)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
summary{font-family:var(--cond);font-size:1.2rem;font-weight:700;padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary .st{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--mute);white-space:nowrap}
summary .st.ok{color:var(--ok)}
details[open]>summary{border-bottom:3px solid var(--yel)}
.bd{padding:8px 16px 16px}
.ctx{background:var(--soft);border-radius:8px;padding:10px 12px;margin:6px 0 12px}
label{display:block;font-weight:600;margin:14px 0 6px}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.msg{font-size:.92rem;margin-top:8px;min-height:1.2em}.msg.ok{color:var(--ok)}.msg.bad{color:#B83A2E}
ul{margin:6px 0;padding-left:22px}
footer{max-width:820px;margin:0 auto;padding:0 16px 30px;color:var(--mute);font-size:.85rem;text-align:center}</style>
</head>
<body>
<header class="eg-head"><div class="in"><a class="eg-logo" href="../" data-logo hidden><img alt="Logo de la institución"></a><span class="eg-tt"><b id="tt">Talleres de casos</b><small data-inst="corta"></small></span><button onclick="location.href='../'">Inicio</button></div></header>
<main>
<div id="aviso" class="card" hidden></div>
<div id="mat" hidden></div>
</main>
<footer>Responde con tus palabras y con argumentos técnicos. Cada caso queda registrado con tu nombre y la fecha de envío.<br><small>© 2026 Daniel González · Todos los derechos reservados. Prohibida su copia, modificación o distribución sin autorización escrita del autor.</small></footer>
<script src="../formaciones.js"></script>
<script src="../engranaje.js"></script>
<script>
var MAT={
 'taller-mini':{titulo:'Taller integrador · minicargador',intro:'Lee cada contexto, analiza la situación y responde con argumentos técnicos. No basta con sí o no: explica por qué. Envía cada caso cuando termines.',casos:[
  {t:'Caso 1. Recepción del equipo',ctx:'Son las 6:50 a. m. y recibes un minicargador que trabajó el turno nocturno. Observas humedad de aceite en una unión hidráulica, una llanta con baja presión, filtro de aire muy sucio, combustible al 35 % y el operador saliente comenta que los brazos elevaron lentamente al final del turno. El residente exige comenzar de inmediato.',qs:['Del contexto, ¿qué datos son críticos y cuáles no influyen en la decisión inicial?','Ordena las acciones antes del primer encendido.','¿Aceptarías operar inmediatamente? Justifica.','¿Qué vigilarías durante los primeros minutos?','¿Qué consecuencias tendría ignorar las anomalías?']},
  {t:'Caso 2. Cambio de patrón',ctx:'El equipo está configurado en un patrón diferente al que acostumbras. Debes cargar material entre columnas con muy poco espacio para maniobrar.',qs:['¿Cómo comprobarías el patrón sin riesgo?','¿Qué maniobras evitarías al inicio?','¿Qué error es más probable?','¿Qué patrón elegirías y por qué?','¿Qué movimientos simultáneos aprovecharías?']},
  {t:'Caso 3. Carga',ctx:'El operador entra con exceso de velocidad al banco de material, mantiene el cucharón horizontal y levanta los brazos antes de terminar el llenado.',qs:['¿Por qué disminuye la productividad?','Describe la técnica correcta.','¿Qué sistemas sufren mayor esfuerzo?','¿Qué señales indican un cargue eficiente?','¿Cómo reducirías el desgaste?']},
  {t:'Caso 4. Pendientes',ctx:'Debes transportar material por una rampa húmeda mientras personal camina cerca.',qs:['¿Cómo planificas el recorrido?','¿Qué harías si pierdes tracción?','¿Cómo cambia el centro de gravedad?','¿Qué comunicarías al personal?','¿Qué maniobra nunca realizarías?']},
  {t:'Caso 5. Diagnóstico',ctx:'El aceite hidráulico se calienta, el cucharón responde lentamente y aparece un ruido intermitente.',qs:['Propón tres hipótesis.','¿Qué revisarías primero, dentro de lo que le corresponde a la {op}?','¿Qué información le darías a mantenimiento en el reporte?','¿Continuarías trabajando? Justifica.','¿Qué daños pueden aparecer?']},
  {t:'Caso 6. Implementos',ctx:'Debes instalar horquillas para mover estibas en un terreno ligeramente inclinado.',qs:['Describe el procedimiento seguro.','¿Qué verificas antes de desacoplar?','¿Cómo confirmas el correcto aseguramiento?','¿Cómo cambia la estabilidad?','¿Cuál es el error más frecuente?']},
  {t:'Caso 7. Productividad',ctx:'El residente exige producir más sin aumentar consumo ni riesgos.',qs:['Propón cinco mejoras.','¿Qué hábitos reducen la productividad?','¿Cómo optimizas el recorrido?','¿Qué indicador medirías?','¿Qué nunca sacrificarías?']},
  {t:'Caso 8. Seguridad',ctx:'Un ayudante cruza repetidamente detrás del minicargador durante la operación.',qs:['¿Cómo actuarías?','¿Detendrías la operación?','¿Qué controles permanentes implementarías?','¿Qué accidente podría ocurrir?','¿Qué responsabilidad tiene la {op}?']},
  {t:'Caso 9. Transmisión',ctx:'El motor mantiene RPM normales pero el equipo avanza lento y gira con poca fuerza bajo carga.',qs:['¿Qué sistema sospecharías primero?','Explica el recorrido de la potencia desde el motor hasta las ruedas.','¿Cómo diferenciarías una falla mecánica de una hidráulica por los síntomas?','¿Qué datos anotarías para el reporte (horómetro, temperatura, condición de trabajo)?','¿Cuál es tu conclusión preliminar y qué decides?']},
  {t:'Caso 10. Entrega',ctx:'Finaliza la jornada y otro operador recibirá el equipo.',qs:['¿Qué información dejarías en el reporte?','¿Qué pendientes entregarías a mantenimiento?','¿Qué evidencia registrarías?','¿Cómo estacionarías el equipo?','¿Qué puede pasar si no reportas anomalías?']}
 ]},
 'actividad-mini':{titulo:'Criterio operacional · minicargador',intro:'La operación segura comienza antes de mover la máquina. Desarrolla las actividades que te asigne tu instructor y envía cada una al terminar. En la socialización tendrás que argumentar tus respuestas.',casos:[
  {t:'Actividad 1. Criterio operacional',ctx:'',qs:['¿Qué entiendes por criterio operacional?','¿Cuál es la diferencia entre observar y analizar?','Menciona diez aspectos que inspeccionarías antes de iniciar una operación.','Explica el ciclo del criterio operacional: observar, interpretar, decidir, ejecutar, evaluar y corregir.']},
  {t:'Actividad 2. Aproximación al material',ctx:'',qs:['Explica cómo aproximarías correctamente el minicargador.','Posición correcta del cucharón.','Velocidad recomendada.','Alineación frente al banco.','Errores frecuentes.']},
  {t:'Actividad 3. Corte y penetración',ctx:'',qs:['¿Qué es el ángulo de ataque?','¿Qué es la línea de penetración?','Explica el recogido del cucharón (roll back).','¿Cómo administras la tracción?','¿Por qué no debe acelerarse excesivamente?']},
  {t:'Actividad 4. Movimientos simultáneos',ctx:'',qs:['Explica cómo coordinarías al mismo tiempo el avance, la elevación, el recogido del cucharón y la dirección.','Explica por qué esta coordinación mejora la productividad y disminuye el desgaste del minicargador.']},
  {t:'Actividad 5. Investigación de fabricantes',ctx:'Investiga Bobcat, Caterpillar, Case, John Deere y New Holland. Compara además el Bobcat S570 con el Bobcat S630 en su ficha técnica (tipo de elevación, capacidad nominal y peso).',qs:['¿Qué encontraste de cada fabricante?','Compara el S570 y el S630.','¿En qué tipo de trabajo utilizarías cada uno y por qué?']},
  {t:'Actividad 6. Caso operacional',ctx:'Llegas a una obra y encuentras terreno húmedo, pendiente, material granular, personas transitando y poco espacio para girar.',qs:['¿Qué analizarías primero?','¿Qué riesgos identificas?','¿Cuál sería tu plan de trabajo?','¿Qué técnica utilizarías?','¿Cómo verificarías que la maniobra fue correcta?']},
  {t:'Reflexión final',ctx:'«El control de la máquina comienza antes de tocar el joystick.»',qs:['Explica esta afirmación con tus palabras y relaciónala con el criterio operacional.']}
 ]}
};
var ID=(location.hash||'#taller-mini').slice(1),M=MAT[ID]||MAT['taller-mini'];if(!MAT[ID])ID='taller-mini';
var mat=document.getElementById('mat'),av=document.getElementById('aviso'),VISTO={};
function esc(s){return EG.esc(s);}
function op(s){return String(s).replace(/\{op\}/g,EG.op());}
function k(){return 'tal_'+ID+'_'+(EG.reg?EG.reg.documento:'');}
function ld(){try{return JSON.parse(localStorage.getItem(k()))||{b:{},env:{}};}catch(e){return {b:{},env:{}};}}
function sv(S){try{localStorage.setItem(k(),JSON.stringify(S));}catch(e){}}
function reg(ev,bl){var x=ev+'|'+bl;if(VISTO[x]||!EG.reg)return;VISTO[x]=1;try{EG.apiS('lectura',{material:ID,evento:ev,bloque:bl});}catch(e){}}
function pinta(){
 EG.aplicarMarca();document.getElementById('tt').textContent=M.titulo;document.title=M.titulo;
 var f=EG.formacion(),ok=false;
 if(EG.reg&&f){try{ok=EG.acceso(f,ID);}catch(e){ok=!!(f.apps&&f.apps.indexOf(ID)>=0);}}
 if(!ok){mat.hidden=true;av.hidden=false;av.innerHTML=(!EG.reg||!f)?'<h1>Ingresa a tu formación</h1><p class="mute">Para desarrollar este taller, ingresa primero con tu documento.</p><a class="go" href="../">Ir al ingreso</a>':'<h1>Taller aún no habilitado</h1><p class="mute">Tu instructor lo habilita cuando el grupo llegue al tema.</p><a class="go" href="../">Volver al inicio</a>';return;}
 av.hidden=true;mat.hidden=false;reg('abre','');
 var S=ld(),n=0,h='';
 M.casos.forEach(function(c,i){
  var env=S.env[i];if(env)n++;
  h+='<details data-i="'+i+'"><summary><span>'+esc(c.t)+'</span><span class="st'+(env?' ok':'')+'" id="st'+i+'">'+(env?'Enviado '+esc(env):'Pendiente')+'</span></summary><div class="bd">'+(c.ctx?'<div class="ctx">'+esc(op(c.ctx))+'</div>':'');
  c.qs.forEach(function(q,j){var id='r'+i+'_'+j;h+='<label for="'+id+'">'+(j+1)+'. '+esc(op(q))+'</label><textarea id="'+id+'" data-i="'+i+'" data-j="'+j+'" maxlength="2500">'+esc((S.b[i]||{})[j]||'')+'</textarea>';});
  h+='<button class="btn" id="b'+i+'" onclick="enviar('+i+')">'+(env?'Enviar de nuevo (corrección)':'Enviar este caso')+'</button><div class="msg" id="m'+i+'"></div></div></details>';
 });
 mat.innerHTML='<div class="card"><h1>'+esc(M.titulo)+'</h1><p>'+esc(op(M.intro))+'</p><p class="mute" id="cnt">'+n+' de '+M.casos.length+' enviados</p><div class="pg"><i id="bar" style="width:'+Math.round(n*100/M.casos.length)+'%"></i></div></div>'+h;
 mat.querySelectorAll('textarea').forEach(function(t){t.addEventListener('input',function(){var S=ld(),i=t.getAttribute('data-i'),j=t.getAttribute('data-j');S.b[i]=S.b[i]||{};S.b[i][j]=t.value;sv(S);});});
 mat.querySelectorAll('details').forEach(function(d){d.addEventListener('toggle',function(){if(d.open)reg('bloque',M.casos[d.getAttribute('data-i')].t);});});
}
function enviar(i){
 var c=M.casos[i],r=[],vac=0;
 c.qs.forEach(function(q,j){var v=(document.getElementById('r'+i+'_'+j).value||'').trim();if(v.length<3)vac++;r.push({q:op(q),r:v});});
 var m=document.getElementById('m'+i),b=document.getElementById('b'+i);
 if(vac){m.className='msg bad';m.textContent='Responde todas las preguntas antes de enviar ('+vac+' sin responder).';return;}
 b.disabled=true;m.className='msg';m.textContent='Enviando…';
 EG.apiS('taller',{material:ID,caso:c.t,respuestas:r}).then(function(x){
  b.disabled=false;
  if(!x.ok){m.className='msg bad';m.textContent=x.error||'No se pudo enviar. Intenta de nuevo.';return;}
  var S=ld(),f=new Date().toLocaleString('es-CO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});S.env[i]=f;sv(S);
  var st=document.getElementById('st'+i);st.textContent='Enviado '+f;st.className='st ok';b.textContent='Enviar de nuevo (corrección)';
  m.className='msg ok';m.textContent='Caso registrado. Tu instructor lo califica en el registro.';
  var n=Object.keys(S.env).length;document.getElementById('cnt').textContent=n+' de '+M.casos.length+' enviados';document.getElementById('bar').style.width=Math.round(n*100/M.casos.length)+'%';
 });
}
window.addEventListener('hashchange',function(){location.reload();});
EG.onReady=pinta;
EG.iniciar();
pinta();
</script>
</body>
</html>
