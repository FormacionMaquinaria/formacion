<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de formación</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engranaje.css">
<style>
:root{--bg:#E8EAED;--card:#fff;--ink:#1F2124;--mute:#5B6068;--line:#CDD1D6;--yel:#FFB800;--graf:#34373B;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#16171A;--card:#202226;--ink:#ECEDEF;--mute:#A3A8B0;--line:#363A40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.hero{background:var(--graf);color:#fff;border:none;position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;padding:22px 20px 28px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--yel) 0 12px,#202225 12px 24px)}
.hero img{width:104px;height:auto;background:#fff;border-radius:10px;padding:6px;flex:0 0 auto}
h1,h2{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
.hero h1{font-size:2.3rem}
.hero p{margin:6px 0 0;color:#C5C9CF}
h2{font-size:1.55rem;margin-bottom:6px}
.mute{color:var(--mute);font-size:.95rem}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app{display:block;padding:16px 18px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.app:first-child{border-top:none}
.app:hover{background:var(--bg)}
.app b{display:block;font-family:var(--cond);font-size:1.4rem;font-weight:700}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lnk{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.sec-t{font-family:var(--cond);font-size:1.3rem;margin:22px 2px 10px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
footer{max-width:820px;margin:0 auto;padding:0 16px 32px;color:var(--mute);font-size:.82rem}
@media (max-width:480px){.hero{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="eg-head"><div class="in"><span class="eg-logo" data-logo hidden><img alt="Logo de la institución"></span><span class="eg-tt"><b>Plataforma de formación</b><small data-inst></small></span></div></header>
<main id="app"></main>
<footer><span data-inst></span><br><small>© 2026 Daniel González · Todos los derechos reservados. Prohibida su copia, modificación o distribución sin autorización escrita del autor.</small></footer>
<script src="formaciones.js"></script>
<script src="engranaje.js"></script>
<script>
var app=document.getElementById('app');
function render(){
 var m=EG.marca();EG.aplicarMarca();
 var hero='<div class="card hero">'+(m&&m.logo?'<img src="'+m.logo+'" alt="Logo de la institución">':'')+'<div><h1>Formación en maquinaria amarilla</h1>'+(m?'<p>'+EG.esc(m.institucion)+'</p>':'<p>Plataforma de formación técnica</p>')+'</div></div>';
 var f=EG.formacion();
 if(!EG.reg||!f){
  app.innerHTML=hero+'<div class="card"><h2>Ingreso de aprendices</h2><p class="mute">Si ya te registraste, ingresa con tu documento. Si es tu primera vez, haz tu registro con el código de grupo que te dio tu instructor.</p>'+EG.formHTML(null,'Ingresar a mi formación')+'</div>';
  EG.showF();return;
 }
 var apps=f.apps.map(function(id){var a=APPS[id];return a?'<a class="app" href="'+a.ruta+'"><b>'+a.nombre+'</b><span class="mute">'+a.desc+'</span></a>':'';}).join('');
 app.innerHTML=hero+'<div class="card"><div class="who"><div><span class="eg-badge">'+EG.esc(f.tipo)+'</span><h2 style="margin-top:8px">'+EG.esc(f.nombre)+'</h2><p class="mute">'+EG.esc(f.sede)+'. '+EG.esc(f.horario)+'</p><p>'+EG.esc(EG.reg.nombre)+', documento '+EG.esc(EG.reg.documento)+'</p></div><button class="lnk" onclick="EG.salir()">Cambiar aprendiz</button></div></div><h3 class="sec-t">Tus apps de formación</h3><div class="list">'+apps+'</div>';
}
EG.onReady=render;
render();
EG.iniciar();
</script>
</body>
</html>
